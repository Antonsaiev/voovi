x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  voovi-web:
    build:
      context: ./voovi.ru
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: voovi_web
    logging: *bounded-logging
    restart: unless-stopped
    env_file:
      - ./configs/env/prod.env
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - voovi_doc:/var/www/html/doc
      - voovi_log:/var/www/html/log
      - voovi_upload:/var/www/html/upload
      - voovi_files:/var/www/html/files
      - type: bind
        source: /root/docker/voovi/voovi.ru/files/agentkkt
        target: /var/www/html/files/agentkkt
        read_only: true
        bind:
          create_host_path: false
      - voovi_voicecatalog:/var/www/html/voicecatalog
      - voovi_img:/var/www/html/img
      - voovi_vipiska:/var/www/html/vipiska
      - voovi_scheta:/var/www/html/scheta
      - voovi_mail_database:/var/www/html/mail/database
    networks:
      voovi:
        aliases:
          - voovi.ru

  svoovi-api:
    build:
      context: ./s.voovi.ru-api
      dockerfile: Dockerfile
    container_name: voovi_prod_svoovi_api
    logging: *bounded-logging
    hostname: apisvoovi
    restart: unless-stopped
    command: sh -c 'python manage.py collectstatic --noinput && exec gunicorn SvooviAPI.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -'
    env_file:
      - ./configs/env/prod.env
    ports:
      - "127.0.0.1:18001:8000"
    volumes:
      - voovi_kontur_automation:/usr/src/app/var/kontur_automation
      - voovi_payroll:/usr/src/app/var/payroll
      - voovi_banking:/usr/src/app/var/banking/state
      - voovi_reminders:/usr/src/app/var/reminders
    networks:
      voovi:
        aliases:
          - s.voovi.ru

  svoovi-api-tasks:
    build:
      context: ./s.voovi.ru-api
      dockerfile: Dockerfile
    container_name: voovi_prod_svoovi_api_tasks
    logging: *bounded-logging
    hostname: apisvoovi_tasks
    restart: unless-stopped
    command: python manage.py process_tasks
    depends_on:
      svoovi-api:
        condition: service_started
    env_file:
      - ./configs/env/prod.env
    environment:
      HOROSCOPE_ENABLED: "1"
      KONTUR_AUTOMATION_VOOVI_URL: http://svoovi-api:8000
    volumes:
      - voovi_horoscope:/usr/src/app/var/horoscope
      - voovi_kontur_automation:/usr/src/app/var/kontur_automation
      - voovi_payroll:/usr/src/app/var/payroll
      - type: bind
        source: ./var/bank/downloads/ready
        target: /usr/src/app/var/banking/incoming
        bind:
          create_host_path: true
      - type: bind
        source: ./var/bank/file_for_process
        target: /usr/src/app/var/banking/prepared
        bind:
          create_host_path: true
      - type: bind
        source: ./analitic/uploads/payments
        target: /usr/src/app/var/banking/uploads
        bind:
          create_host_path: true
      - type: bind
        source: /root/analitic/uploads/payments
        target: /usr/src/app/var/banking/legacy_uploads
        bind:
          create_host_path: false
      - voovi_banking:/usr/src/app/var/banking/state
      - voovi_reminders:/usr/src/app/var/reminders
    networks:
      - voovi

  analitic:
    build:
      context: ./analitic
      dockerfile: Dockerfile
    container_name: voovi_prod_analitic
    logging: *bounded-logging
    hostname: analitic
    restart: unless-stopped
    command: sh -c 'python manage.py collectstatic --noinput && exec gunicorn ai_auto_voovi.wsgi:application --bind 0.0.0.0:7000 --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -'
    depends_on:
      svoovi-api:
        condition: service_started
    env_file:
      - ./configs/env/prod.env
    ports:
      - "127.0.0.1:18002:7000"
    volumes:
      - ./analitic/uploads:/code/uploads
      - voovi_horoscope:/code/var/horoscope:ro
    networks:
      - voovi

  bank-selenium:
    image: selenium/standalone-firefox:4.52.0-20261101
    shm_size: "2gb"
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      SE_NODE_MAX_SESSIONS: "1"
      SE_NODE_SESSION_TIMEOUT: "180"
      SE_START_VNC: "false"
      SE_START_NO_VNC: "false"
      TZ: Europe/Moscow
    volumes:
      - ./var/bank/downloads:/bank
    networks:
      - voovi
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  bank-downloader:
    build:
      context: .
      dockerfile: banking_downloader/Dockerfile
    restart: unless-stopped
    logging: *bounded-logging
    env_file:
      - ./configs/env/prod.env
    environment:
      TZ: Europe/Moscow
    volumes:
      - ./var/bank/downloads:/bank
    depends_on:
      bank-selenium:
        condition: service_healthy
    networks:
      - voovi
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  bank-download-tasks:
    build:
      context: ./s.voovi.ru-api
      dockerfile: Dockerfile
    command: python manage.py process_tasks --queue bank_downloads
    restart: unless-stopped
    stop_grace_period: 1900s
    logging: *bounded-logging
    env_file:
      - ./configs/env/prod.env
    depends_on:
      bank-downloader:
        condition: service_healthy
    networks:
      - voovi

networks:
  voovi:
    name: voovi

volumes:
  voovi_banking:
  voovi_kontur_automation:
  voovi_payroll:
  voovi_doc:
  voovi_log:
  voovi_upload:
  voovi_files:
  voovi_voicecatalog:
  voovi_img:
  voovi_vipiska:
  voovi_scheta:
  voovi_mail_database:
  voovi_reminders:
  voovi_horoscope:
    name: voovi_horoscope
