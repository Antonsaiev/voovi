x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mariadb:10.2
    container_name: voovi_db
    logging: *bounded-logging
    restart: unless-stopped
    env_file:
      - ./configs/env/local.env
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --sql-mode=
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - voovi_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      voovi:
        aliases:
          - mysql

  db-restore:
    image: mariadb:10.2
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./configs/env/local.env
    volumes:
      - type: bind
        source: ./voovi.sql
        target: /dump/voovi.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/db/restore-db.sh
        target: /usr/local/bin/restore-db.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./database/migrations/2026-11-14_avkontur_bill_link.sql
        target: /dump/avkontur_bill_link.sql
        read_only: true
    entrypoint: ["/bin/sh", "/usr/local/bin/restore-db.sh"]
    networks:
      - voovi

  voovi-web:
    build:
      context: ./voovi.ru
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: voovi_web
    logging: *bounded-logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./configs/env/local.env
    ports:
      - "${VOOVI_WEB_PORT:-8080}:80"
    volumes:
      - ./voovi.ru:/var/www/html
      - ./voovi.ru/docker/conf.php:/var/www/html/conf.php:ro
      - ./voovi.ru/docker/.htaccess:/var/www/html/.htaccess:ro
      - ./voovi.ru/docker/debug-mail.ini:/usr/local/etc/php/conf.d/zz-debug-mail.ini:ro
    networks:
      voovi:
        aliases:
          - voovi.ru

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: voovi_phpmyadmin
    logging: *bounded-logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./configs/env/local.env
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - voovi

  nginx:
    image: nginx:1.27-alpine
    container_name: voovi_nginx
    logging: *bounded-logging
    restart: unless-stopped
    depends_on:
      voovi-web:
        condition: service_started
      svoovi-api:
        condition: service_started
      analitic:
        condition: service_started
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./configs/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - voovi

  svoovi-api:
    build:
      context: ./s.voovi.ru-api
      dockerfile: Dockerfile
    container_name: apisvoovi
    logging: *bounded-logging
    hostname: apisvoovi
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./configs/env/local.env
    ports:
      - "${SVOOVI_API_PORT:-7005}:8000"
    volumes:
      - ./s.voovi.ru-api:/usr/src/app
      - voovi_banking:/usr/src/app/var/banking/state
      - voovi_reminders:/usr/src/app/var/reminders
    networks:
      voovi:
        aliases:
          - s.voovi.ru

  svoovi-api-tasks:
    build:
      context: ./s.voovi.ru-api
      dockerfile: Dockerfile
    container_name: apisvoovi_tasks
    logging: *bounded-logging
    hostname: apisvoovi_tasks
    restart: unless-stopped
    command: python manage.py process_tasks
    stop_grace_period: 1900s
    depends_on:
      db:
        condition: service_healthy
      svoovi-api:
        condition: service_started
    env_file:
      - ./configs/env/local.env
    environment:
      HOROSCOPE_ENABLED: "1"
      KONTUR_AUTOMATION_VOOVI_URL: http://svoovi-api:8000
    volumes:
      - voovi_horoscope:/usr/src/app/var/horoscope
      - ./s.voovi.ru-api:/usr/src/app
      - ./var/bank/downloads/ready:/usr/src/app/var/banking/incoming
      - ./var/bank/file_for_process:/usr/src/app/var/banking/prepared
      - ./analitic/uploads/payments:/usr/src/app/var/banking/uploads
      - voovi_banking:/usr/src/app/var/banking/state
      - voovi_reminders:/usr/src/app/var/reminders
    networks:
      - voovi

  analitic:
    build:
      context: ./analitic
      dockerfile: Dockerfile
    container_name: analitic
    logging: *bounded-logging
    hostname: analitic
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:7000 --insecure
    depends_on:
      db:
        condition: service_healthy
      svoovi-api:
        condition: service_started
    env_file:
      - ./configs/env/local.env
    ports:
      - "${ANALITIC_PORT:-7000}:7000"
    volumes:
      - ./analitic:/code
      - voovi_horoscope:/code/var/horoscope:ro
    networks:
      - voovi

  bank-selenium:
    image: selenium/standalone-firefox:4.52.0-20261101
    shm_size: "2gb"
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      SE_NODE_MAX_SESSIONS: "1"
      SE_NODE_SESSION_TIMEOUT: "180"
      SE_START_VNC: "false"
      SE_START_NO_VNC: "false"
      TZ: Europe/Moscow
    volumes:
      - ./var/bank/downloads:/bank
    networks:
      - voovi
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  bank-downloader:
    stop_grace_period: 60s
    build:
      context: .
      dockerfile: banking_downloader/Dockerfile
    restart: unless-stopped
    logging: *bounded-logging
    env_file:
      - ./configs/env/local.env
    environment:
      TZ: Europe/Moscow
    volumes:
      - ./var/bank/downloads:/bank
    depends_on:
      bank-selenium:
        condition: service_healthy
    networks:
      - voovi
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  bank-download-tasks:
    build:
      context: ./s.voovi.ru-api
      dockerfile: Dockerfile
    command: python manage.py process_tasks --queue bank_downloads
    restart: unless-stopped
    stop_grace_period: 1900s
    logging: *bounded-logging
    env_file:
      - ./configs/env/local.env
    depends_on:
      bank-downloader:
        condition: service_healthy
    networks:
      - voovi

networks:
  voovi:
    name: voovi

volumes:
  voovi_mysql:
  voovi_banking:
  voovi_reminders:
  voovi_horoscope:
    name: voovi_horoscope
